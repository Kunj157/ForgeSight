name: Browser demo (wasm)

# Builds the Qt for WebAssembly live demo (FORGESIGHT_DEMO_MODE) and uploads it
# as the `demo-wasm` artifact. This workflow never deploys. It is called by
# landing.yml, the only workflow that deploys GitHub Pages, which places the
# demo under /demo/ of the site. Keeping one deployer avoids each deploy
# replacing the whole site.
on:
  workflow_call:

permissions:
  contents: read

env:
  # Qt for WebAssembly and the Emscripten release Qt documents for it
  # (Qt 6.8: Emscripten 3.1.56). Keep these two in step.
  QT_VERSION: "6.8.1"
  EMSDK_VERSION: "3.1.56"

jobs:
  wasm:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5

      # The wasm build needs a host Qt of the same version for moc, rcc and
      # qmlcachegen. Both installs are cached by the action.
      - name: Install host Qt
        uses: jurplel/install-qt-action@v4
        with:
          version: ${{ env.QT_VERSION }}
          host: linux
          target: desktop
          arch: linux_gcc_64
          dir: ${{ runner.temp }}/qt
          modules: qtcharts
          cache: true

      - name: Install Qt for WebAssembly
        uses: jurplel/install-qt-action@v4
        with:
          version: ${{ env.QT_VERSION }}
          host: all_os
          target: wasm
          arch: wasm_singlethread
          dir: ${{ runner.temp }}/qt
          modules: qtcharts
          cache: true

      - name: Install Emscripten
        uses: mymindstorm/setup-emsdk@v14
        with:
          version: ${{ env.EMSDK_VERSION }}
          actions-cache-folder: emsdk-cache

      # wasm_singlethread: no pthreads, so no SharedArrayBuffer and no
      # COOP/COEP headers. GitHub Pages cannot send those headers.
      - name: Configure
        run: |
          QT_BASE="${{ runner.temp }}/qt/Qt/${QT_VERSION}"
          QT_WASM="$QT_BASE/wasm_singlethread"
          export QT_HOST_PATH="$QT_BASE/gcc_64"
          # The wasm install's qt-cmake arrives without its execute bit.
          chmod +x "$QT_WASM"/bin/* "$QT_BASE"/gcc_64/bin/*
          "$QT_WASM/bin/qt-cmake" -S . -B build-wasm -DCMAKE_BUILD_TYPE=Release \
            -DFORGESIGHT_DEMO_MODE=ON

      - name: Build demo
        run: cmake --build build-wasm --target factory-pulse --parallel 2

      - name: Check the output
        run: |
          test -f build-wasm/ui/app/factory-pulse.html
          test -f build-wasm/ui/app/factory-pulse.wasm
          test -f build-wasm/ui/app/factory-pulse.js

      # Stage the page the site serves at /demo/: the loader shell, the Qt
      # output it loads and the Qt loader files that output references.
      # Everything is relative, so the same files work under any base path.
      - name: Stage the demo
        run: |
          mkdir demo-site
          cp ui/app/web/index.html demo-site/index.html
          find build-wasm/ui/app -maxdepth 1 -type f \
            \( -name 'factory-pulse*' -o -name 'qt*' \) -exec cp {} demo-site/ \;
          test -f demo-site/factory-pulse.html
          test -f demo-site/qtloader.js
          ls -la demo-site

      - uses: actions/upload-artifact@v7
        with:
          name: demo-wasm
          path: demo-site
          if-no-files-found: error
          retention-days: 7
