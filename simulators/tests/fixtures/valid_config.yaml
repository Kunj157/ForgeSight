devices:
  - id: pump-001
    name: "Main Coolant Pump"
    sensors:
      - name: temperature
        unit: "°C"
        min: 20.0
        max: 95.0
        normal_mean: 65.0
        normal_std: 3.0

  - id: compressor-001
    name: "Air Compressor"
    sensors:
      - name: current
        unit: "A"
        min: 0.0
        max: 30.0
        normal_mean: 12.0
        normal_std: 1.5

publish_interval_sec: 1.0
anomaly_injection_rate: 0.02
broker:
  host: "localhost"
  port: 1883
  topic_prefix: "factory/devices"
