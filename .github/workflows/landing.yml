name: landing

# Builds the static marketing site (site/) and the wasm live demo, and publishes
# both to GitHub Pages. This is the only workflow that deploys Pages: the site
# is served at the root and the demo under /demo/ of the same artifact.
# Isolated from the C++ CI: its own Node toolchain and lockfile under site/.

on:
  push:
    branches: [main, dev]
    paths:
      - site/**
      - docs/media/**
      - ui/**
      - alarm-engine/**
      - CMakeLists.txt
      - .github/workflows/landing.yml
      - .github/workflows/pages.yml
  # Pull requests run the build (site and demo) but never the deploy job.
  pull_request:
    branches: [dev]
    paths:
      - site/**
      - docs/media/**
      - ui/**
      - alarm-engine/**
      - CMakeLists.txt
      - .github/workflows/landing.yml
      - .github/workflows/pages.yml
  workflow_dispatch:

permissions:
  contents: read

# Runs for one ref queue rather than overlap. The deploy job also takes the
# shared `pages` group, so a manual dispatch cannot race a push deploy.
concurrency:
  group: landing-${{ github.ref }}
  cancel-in-progress: false

jobs:
  demo:
    name: Build the live demo
    uses: ./.github/workflows/pages.yml

  build:
    name: Build the landing page
    needs: demo
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    defaults:
      run:
        working-directory: site
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          package_json_file: site/package.json
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: site/.node-version
          cache: pnpm
          cache-dependency-path: site/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - name: Build
        run: pnpm build
        env:
          PAGES_BASE_PATH: /${{ github.event.repository.name }}
      # After the site build, which empties site/dist. The demo lands in
      # site/dist/demo, so it is served at <site>/demo/.
      - uses: actions/download-artifact@v7
        with:
          name: demo-wasm
          path: site/dist/demo
      - uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: site/dist

  deploy:
    name: Deploy to GitHub Pages
    # Only pushes to main or dev deploy. Pull requests stop after the build.
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    needs: build
    concurrency:
      group: pages
      cancel-in-progress: false
    runs-on: ubuntu-24.04
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
