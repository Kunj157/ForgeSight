name: CI

on:
  pull_request:
    branches: [dev]

jobs:
  build:
    runs-on: ubuntu-24.04

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: forgesight_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d forgesight_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            cmake g++ pkg-config \
            nlohmann-json3-dev libspdlog-dev libpq-dev \
            libpaho-mqtt-dev libpaho-mqttpp-dev \
            libqt6sql6-sqlite \
            qt6-base-dev qt6-declarative-dev qt6-charts-dev \
            qt6-httpserver-dev qt6-websockets-dev \
            qml6-module-qtquick \
            qml6-module-qtquick-controls \
            qml6-module-qtquick-layouts \
            qml6-module-qtquick-templates \
            qml6-module-qtcharts \
            qml6-module-qtquick-window \
            qml6-module-qtqml \
            qml6-module-qtqml-workerscript

      - name: Configure
        run: cmake -B build -DCMAKE_BUILD_TYPE=Debug

      - name: Build
        run: cmake --build build --parallel

      - name: Test
        run: ctest --test-dir build --output-on-failure
        env:
          QML2_IMPORT_PATH: /usr/lib/x86_64-linux-gnu/qt6/qml
          QT_QPA_PLATFORM: offscreen
          FORGESIGHT_TEST_DB: "host=127.0.0.1 port=5432 dbname=forgesight_test user=postgres password=postgres"

  lint:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Install clang-format
        run: |
          python3 -m pip install --user clang-format==22.1.8
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Check formatting
        run: |
          find ingestion alarm-engine api ui tests \
            \( -name '*.cpp' -o -name '*.h' \) \
            -print0 | xargs -0 clang-format --dry-run --Werror

  docker:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      # COMPOSE_BAKE=false + COMPOSE_PARALLEL_LIMIT=1: without these,
      # `docker compose build` builds all 3 services in parallel (via
      # buildx bake, or even the classic builder), and neither path dedupes
      # the shared `builder` stage across targets — each service racily
      # re-runs its own apt-get, tripling network load and package-mirror
      # timeout risk for no benefit (see docker/compose#13043). Forcing a
      # single sequential build means the 2nd/3rd service hit local layer
      # cache from the 1st's builder stage instead.
      - name: Build backend images
        run: docker compose build
        env:
          COMPOSE_BAKE: "false"
          COMPOSE_PARALLEL_LIMIT: "1"
