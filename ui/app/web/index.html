<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>ForgeSight live demo</title>
  <style>
    :root { color-scheme: dark; }
    html, body { margin: 0; height: 100%; background: #0b0f14; overflow: hidden; }
    iframe { position: fixed; inset: 0; width: 100%; height: 100%; border: 0; }
    #loader {
      position: fixed; inset: 0; display: flex; flex-direction: column;
      align-items: center; justify-content: center; gap: 14px;
      background: #0b0f14; color: #cbd5e1; font: 15px/1.4 system-ui, sans-serif;
      transition: opacity 0.4s ease; z-index: 1;
    }
    #loader.hidden { opacity: 0; pointer-events: none; }
    .spinner {
      width: 34px; height: 34px; border-radius: 50%;
      border: 3px solid #1e293b; border-top-color: #38bdf8;
      animation: spin 0.9s linear infinite;
    }
    #slow { display: none; font-size: 13px; color: #94a3b8; max-width: 32em; text-align: center; padding: 0 16px; }
    @keyframes spin { to { transform: rotate(360deg); } }
    @media (prefers-reduced-motion: reduce) { .spinner { animation-duration: 3s; } }
  </style>
</head>
<body>
  <div id="loader" role="status" aria-live="polite">
    <div class="spinner" aria-hidden="true"></div>
    <div>Loading the ForgeSight live demo…</div>
    <div id="slow">This can take a moment on the first visit. The demo needs WebAssembly and WebGL.</div>
  </div>
  <iframe id="app" src="factory-pulse.html" title="ForgeSight dashboard (simulated data)"></iframe>
  <script>
    (function () {
      var loader = document.getElementById("loader");
      var frame = document.getElementById("app");
      var slow = document.getElementById("slow");
      var hideTimer = null;
      // The Qt loader paints inside the frame; hide our overlay once it has
      // had time to draw its first frame, and show a hint if it stalls.
      setTimeout(function () { slow.style.display = "block"; }, 8000);
      frame.addEventListener("load", function () {
        hideTimer = setTimeout(function () { loader.classList.add("hidden"); }, 1500);
      });
      window.addEventListener("beforeunload", function () { if (hideTimer) clearTimeout(hideTimer); });
    })();
  </script>
</body>
</html>
