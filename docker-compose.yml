# Dockerized backend stack: Postgres, Mosquitto, ingestion, alarm-engine, api.
#
# ingestion/alarm-engine/api all run the *same* forgesight-backend:local
# image (built once, from docker/Dockerfile.backend) with a different
# `entrypoint:` per service — only `ingestion` declares `build:`, so there is
# exactly one image build no matter how compose is invoked (see #28 for why
# that matters: three separate per-service targets sharing a build stage let
# a parallel `docker compose build` triple the heaviest step and once froze
# a real dev machine).
#
# The Qt desktop app and the Python simulators are intentionally left out —
# the desktop app isn't a service, and the simulators are dev tooling you'll
# usually want to run natively (against the MQTT port exposed below) so you
# can edit simulators/config.yaml without rebuilding an image.
#
# Usage:
#   docker compose up --build        # build once + start Postgres, Mosquitto, ingestion, alarm-engine, api
#   PYTHONPATH=. python3 -m simulators.run -c simulators/config.yaml   # feed it data
#   docker compose down               # stop (add -v to also drop the Postgres volume)

services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: forgesight
      POSTGRES_USER: forgesight
      POSTGRES_PASSWORD: forgesight
    ports:
      - "5432:5432"
    volumes:
      - forgesight-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U forgesight -d forgesight"]
      interval: 5s
      timeout: 5s
      retries: 10

  mosquitto:
    image: eclipse-mosquitto:2
    ports:
      - "1883:1883"
    volumes:
      - ./simulators/mosquitto.conf:/mosquitto/config/mosquitto.conf:ro

  ingestion:
    image: forgesight-backend:local
    build:
      context: .
      dockerfile: docker/Dockerfile.backend
    entrypoint: ["/usr/local/bin/ingestion"]
    depends_on:
      postgres:
        condition: service_healthy
      mosquitto:
        condition: service_started
    command:
      - --broker
      - tcp://mosquitto:1883
      - --db
      - host=postgres dbname=forgesight user=forgesight password=forgesight
    restart: unless-stopped

  alarm-engine:
    image: forgesight-backend:local
    entrypoint: ["/usr/local/bin/alarm-engine"]
    depends_on:
      postgres:
        condition: service_healthy
    command:
      - --db
      - host=postgres dbname=forgesight user=forgesight password=forgesight
      - --seed
    restart: unless-stopped

  api:
    image: forgesight-backend:local
    entrypoint: ["/usr/local/bin/api"]
    depends_on:
      postgres:
        condition: service_healthy
      mosquitto:
        condition: service_started
    ports:
      - "8080:8080"
      - "8081:8081"
    # Optional: set FORGESIGHT_API_KEY in the host shell/.env before `up` to
    # require it on every /api/* and WebSocket request (empty/unset keeps
    # auth disabled, matching local-dev defaults). --bind stays 0.0.0.0 here
    # deliberately — Docker's port mapping forwards to the container's
    # network namespace, not loopback, so binding to 127.0.0.1 would make
    # the published ports unreachable from the host.
    environment:
      - FORGESIGHT_API_KEY=${FORGESIGHT_API_KEY:-}
    command:
      - --database
      - host=postgres dbname=forgesight user=forgesight password=forgesight
      - --mqtt
      - tcp://mosquitto:1883
      - --port
      - "8080"
      - --ws-port
      - "8081"
    restart: unless-stopped

volumes:
  forgesight-pgdata:
